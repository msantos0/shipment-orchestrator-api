spring:
  application:
    name: shipment-orchestrator-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/shipment_orchestrator}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all

shipment:
  kafka:
    topic: ${SHIPMENT_KAFKA_TOPIC:shipment-events}
    publisher: ${SHIPMENT_KAFKA_PUBLISHER:kafka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
